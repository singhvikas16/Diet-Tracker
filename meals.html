        let filteredMeals = [...mealDatabase];

        function renderMeals(meals) {
            const grid = document.getElementById('meals-grid');
            const noResults = document.getElementById('no-results');
            
            if (meals.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }
            
            noResults.classList.add('hidden');
            
            grid.innerHTML = meals.map(meal => `
                <div class="meal-card rounded-2xl shadow-lg overflow-hidden card-hover cursor-pointer" onclick="showMealDetail(${meal.id})">
                    <div class="h-48 bg-gradient-to-br from-green-100 to-green-200 flex items-center justify-center">
                        <span class="text-6xl">${getMealEmoji(meal.category)}</span>
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-3">
                            <h3 class="font-semibold text-gray-800 text-lg leading-tight">${meal.name}</h3>
                            <span class="bg-orange-100 text-orange-800 text-xs px-2 py-1 rounded-full font-medium">
                                ${meal.calories} cal
                            </span>
                        </div>
                        <p class="text-gray-600 text-sm mb-4 line-clamp-2">${meal.description}</p>
                        <div class="flex justify-between items-center text-sm text-gray-500 mb-4">
                            <span>⏱️ ${meal.prepTime}</span>
                            <span>🥄 ${meal.ingredients.length} ingredients</span>
                        </div>
                        <div class="grid grid-cols-4 gap-2 text-xs">
                            <div class="text-center p-2 bg-blue-50 rounded">
                                <div class="font-semibold text-blue-600">${meal.protein}g</div>
                                <div class="text-gray-500">Protein</div>
                            </div>
                            <div class="text-center p-2 bg-yellow-50 rounded">
                                <div class="font-semibold text-yellow-600">${meal.carbs}g</div>
                                <div class="text-gray-500">Carbs</div>
                            </div>
                            <div class="text-center p-2 bg-green-50 rounded">
                                <div class="font-semibold text-green-600">${meal.fat}g</div>
                                <div class="text-gray-500">Fat</div>
                            </div>
                            <div class="text-center p-2 bg-purple-50 rounded">
                                <div class="font-semibold text-purple-600">${meal.fiber}g</div>
                                <div class="text-gray-500">Fiber</div>
                            </div>
                        </div>
                        <div class="mt-4 flex flex-wrap gap-2">
                            ${meal.tags.map(tag => `
                                <span class="bg-gray-100 text-gray-600 text-xs px-2 py-1 rounded-full">
                                    ${getTagEmoji(tag)} ${tag.replace('-', ' ')}
                                </span>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getMealEmoji(category) {
            const emojis = {
                breakfast: '🌅',
                lunch: '🌞',
                dinner: '🌙',
                snack: '🍎'
            };
            return emojis[category] || '🍽️';
        }

        function getTagEmoji(tag) {
            const emojis = {
                vegetarian: '🥬',
                'high-protein': '💪'
            };
            return emojis[tag] || '🏷️';
        }

        function filterMeals(filter) {
            // Update filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('filter-active');
                btn.classList.add('filter-inactive');
            });
            
            event.target.classList.remove('filter-inactive');
            event.target.classList.add('filter-active');
            
            // Filter meals
            if (filter === 'all') {
                filteredMeals = [...mealDatabase];
            } else {
                filteredMeals = mealDatabase.filter(meal => 
                    meal.category === filter || meal.tags.includes(filter)
                );
            }
            
            renderMeals(filteredMeals);
        }

        function searchMeals(query) {
            const searchTerm = query.toLowerCase();
            const searchedMeals = filteredMeals.filter(meal =>
                meal.name.toLowerCase().includes(searchTerm) ||
                meal.description.toLowerCase().includes(searchTerm) ||
                meal.ingredients.some(ingredient => ingredient.toLowerCase().includes(searchTerm))
            );
            
            renderMeals(searchedMeals);
        }

        function showMealDetail(mealId) {
            const meal = mealDatabase.find(m => m.id === mealId);
            if (!meal) return;

        function closeMealModal() {
            document.getElementById('meal-modal').classList.add('hidden');
            selectedMeal = null;
        }

        function addToMealPlan() {
            if (selectedMeal) {
                // Here you would typically add the meal to the user's meal plan
                // For now, we'll show a success message
                alert(`${selectedMeal.name} added to your meal plan!`);
                closeMealModal();
            }
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            renderMeals(mealDatabase);
            
            // Add search functionality
            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', (e) => {
                searchMeals(e.target.value);
            });
            
            // Animate cards on load
            const cards = document.querySelectorAll('.card-hover');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        anime({
                            targets: entry.target,
                            translateY: [50, 0],
                            opacity: [0, 1],
                            duration: 800,
                            easing: 'easeOutQuart',
                            delay: Math.random() * 200
                        });
                    }
                });
            });

            cards.forEach(card => observer.observe(card));
        });

        // Handle escape key to close modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeMealModal();
            }
        });
    </script>
